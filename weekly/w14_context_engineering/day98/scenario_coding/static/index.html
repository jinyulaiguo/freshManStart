<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Agent — Context Runtime Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bone-bg:#F9F8F3;--pure-white:#FFFFFF;--charcoal:#141413;
            --on-sv:#464742;--clay:#D97757;--border:#e9e8e3;--border-h:#c7c7c0;
            --surface-c:#efeee9;--error:#ba1a1a;--error-bg:#ffdad6;
            --success:#2e623a;--success-bg:#edf6ef;--warning-bg:#fff3e0;--warning:#e65100;
            --font-serif:'Source Serif 4',serif;--font-sans:'Inter',sans-serif;
            --r-sm:0.25rem;--r-md:0.5rem;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:var(--font-sans);background:var(--bone-bg);color:var(--charcoal);font-size:14px;line-height:1.5;}
        .header{background:var(--pure-white);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
        .header h1{font-family:var(--font-serif);font-size:20px;font-weight:600;}
        .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--on-sv);background:var(--surface-c);padding:4px 10px;border-radius:var(--r-sm);}
        .btn{font-family:var(--font-sans);font-size:13px;font-weight:500;padding:6px 14px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;background:var(--pure-white);color:var(--charcoal);}
        .btn:hover{border-color:var(--charcoal);}
        .btn-primary{background:var(--charcoal);color:var(--pure-white);border-color:var(--charcoal);}
        .main{display:grid;grid-template-columns:25% 45% 30%;height:calc(100vh - 49px - 36px);gap:1px;background:var(--border);}
        .panel{background:var(--pure-white);overflow-y:auto;padding:16px;}
        .panel-title{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
        .node-card{padding:10px;margin-bottom:8px;border:1px solid var(--border);border-radius:var(--r-md);transition:border-color 0.2s;}
        .node-card.active{border-color:var(--clay);border-left:3px solid var(--clay);}
        .node-card.done{border-color:var(--success);border-left:3px solid var(--success);}
        .node-name{font-weight:600;font-size:13px;}
        .node-model{font-size:11px;color:var(--clay);font-weight:600;}
        .node-cost{font-size:11px;color:var(--on-sv);}
        .log-entry{padding:8px;margin-bottom:4px;background:var(--surface-c);border-radius:var(--r-sm);font-size:12px;}
        .log-entry.security{background:var(--error-bg);color:var(--error);}
        .log-entry.approval{background:var(--warning-bg);color:var(--warning);}
        .log-entry.routing{background:var(--success-bg);color:var(--success);}
        .cost-ring{width:120px;height:120px;margin:12px auto;position:relative;}
        .cost-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
        .cost-ring .bg{fill:none;stroke:var(--border);stroke-width:10;}
        .cost-ring .fg{fill:none;stroke:var(--success);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 0.5s,stroke 0.3s;}
        .cost-ring .label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:14px;font-weight:600;}
        .state-indicator{display:inline-block;padding:3px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:600;}
        .state-NORMAL{background:var(--success-bg);color:var(--success);}
        .state-WARNING{background:var(--warning-bg);color:var(--warning);}
        .state-DEGRADED{background:var(--error-bg);color:var(--error);}
        .state-STOP{background:var(--charcoal);color:var(--pure-white);}
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:100;align-items:center;justify-content:center;}
        .modal-overlay.show{display:flex;}
        .modal{background:var(--pure-white);border:1px solid var(--border);border-radius:var(--r-md);padding:24px;max-width:420px;width:90%;}
        .modal h3{font-family:var(--font-serif);font-size:18px;margin-bottom:12px;}
        .modal p{font-size:13px;color:var(--on-sv);margin-bottom:8px;}
        .modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
        .btn-approve{background:var(--success);color:var(--pure-white);border:none;padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;}
        .btn-reject{background:var(--error);color:var(--pure-white);border:none;padding:8px 16px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;}
        .footer{background:var(--pure-white);border-top:1px solid var(--border);padding:8px 24px;display:flex;gap:24px;font-size:12px;color:var(--on-sv);}
        .footer-item strong{color:var(--charcoal);}
        .input-area{border-top:1px solid var(--border);padding-top:12px;display:flex;gap:8px;}
        input[type="text"]{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;outline:none;font-family:var(--font-sans);}
        input:focus{border-color:var(--charcoal);}
        .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--clay);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px;}
        @keyframes spin{to{transform:rotate(360deg);}}
        ::-webkit-scrollbar{width:5px;}
        ::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:3px;}
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex;align-items:center;gap:12px;">
            <h1>Coding Agent</h1>
            <span class="badge">📡 Port 8099</span>
            <span class="badge" id="statusBadge">⏳ 等待任务</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <span class="badge" id="stateBadge">NORMAL</span>
            <button class="btn" onclick="resetAgent()">🔄 重置</button>
        </div>
    </div>

    <div class="main">
        <!-- Left: Node Flow -->
        <div class="panel">
            <div class="panel-title">🔀 LangGraph 节点流</div>
            <div class="node-card" id="node_planner">
                <div class="node-name">📋 Planner Node</div>
                <div class="node-model" id="planner_model">—</div>
                <div class="node-cost" id="planner_cost">—</div>
            </div>
            <div style="text-align:center;color:var(--on-sv);font-size:18px;padding:4px 0;">↓</div>
            <div class="node-card" id="node_executor">
                <div class="node-name">⚡ Tool Executor</div>
                <div class="node-model" id="executor_model">—</div>
                <div class="node-cost" id="executor_cost">—</div>
            </div>
            <div style="text-align:center;color:var(--on-sv);font-size:18px;padding:4px 0;">↓</div>
            <div class="node-card" id="node_reflection">
                <div class="node-name">🔍 Reflection Node</div>
                <div class="node-model" id="reflection_model">—</div>
                <div class="node-cost" id="reflection_cost">—</div>
            </div>

            <div class="panel-title" style="margin-top:20px;">📊 路由节省</div>
            <div id="savingsInfo" style="font-size:12px;color:var(--on-sv);">执行后显示</div>
        </div>

        <!-- Center: Execution Log -->
        <div class="panel">
            <div style="display:flex;flex-direction:column;height:100%;">
                <div class="panel-title">📜 执行日志流</div>
                <div id="logContainer" style="flex:1;overflow-y:auto;">
                    <div style="text-align:center;padding:40px;color:var(--on-sv);font-size:13px;">
                        输入重构任务描述开始执行
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="taskInput"
                           placeholder="输入重构任务 (如: 将 Session Auth 迁移至 JWT)..."
                           onkeypress="if(event.key==='Enter')startTask()">
                    <button class="btn btn-primary" onclick="startTask()">执行</button>
                </div>
            </div>
        </div>

        <!-- Right: Cost Governance -->
        <div class="panel">
            <div class="panel-title">💰 Cost Governance 透视</div>
            <div class="cost-ring" id="costRing">
                <svg viewBox="0 0 120 120">
                    <circle class="bg" cx="60" cy="60" r="50"/>
                    <circle class="fg" id="costArc" cx="60" cy="60" r="50"
                            stroke-dasharray="314" stroke-dashoffset="314"/>
                </svg>
                <div class="label" id="costLabel">0%</div>
            </div>
            <div style="text-align:center;margin-bottom:16px;">
                <span class="state-indicator state-NORMAL" id="stateIndicator">NORMAL</span>
            </div>
            <div style="font-size:12px;">
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
                    <span>已消耗</span><strong id="usedCost">$0.000</strong>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
                    <span>预算</span><strong>$0.150</strong>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
                    <span>当前模型</span><strong id="currentModel">—</strong>
                </div>
            </div>

            <div class="panel-title" style="margin-top:16px;">🔐 审批日志</div>
            <div id="approvalLog" style="font-size:12px;color:var(--on-sv);">暂无</div>
        </div>
    </div>

    <!-- Approval Modal -->
    <div class="modal-overlay" id="approvalModal">
        <div class="modal">
            <h3>⚠️ 高危操作审批</h3>
            <p id="approvalFile">—</p>
            <p id="approvalReason">—</p>
            <p id="approvalImpact" style="color:var(--error);">—</p>
            <div class="actions">
                <button class="btn-reject" onclick="resolveApproval(false)">❌ 拒绝</button>
                <button class="btn-approve" onclick="resolveApproval(true)">✅ 批准</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-item">总费用: <strong id="footerCost">$0.000</strong></div>
        <div class="footer-item">节省比例: <strong id="footerSavings">—</strong></div>
        <div class="footer-item">审批: <strong id="footerApprovals">0</strong></div>
        <div class="footer-item">凭证检测: <strong id="footerCreds" style="color:var(--error);">0</strong></div>
    </div>

    <script>
        let ws=null,pendingApprovalId=null,credCount=0,approvalCount=0;

        function connectWS(){
            const p=location.protocol==='https:'?'wss:':'ws:';
            ws=new WebSocket(`${p}//${location.host}/ws/coding`);
            ws.onopen=()=>{document.getElementById('statusBadge').textContent='🟢 已连接';};
            ws.onmessage=e=>{const m=JSON.parse(e.data);handleEvent(m.type,m.data);};
            ws.onclose=()=>{document.getElementById('statusBadge').textContent='🔴 断开';setTimeout(connectWS,2000);};
        }

        function handleEvent(type,data){
            switch(type){
                case 'node_start':
                    setNodeActive(data.node);
                    addLog(`🚀 节点启动: ${data.node}`,'routing');
                    break;
                case 'routing_decision':
                    updateNodeModel(data.node_name,data.selected_model,data.forced_lightweight);
                    addLog(`🎯 路由: ${data.node_name} → ${data.selected_model}${data.forced_lightweight?' (降级)':''}`,
                        data.forced_lightweight?'security':'routing');
                    break;
                case 'assembly_done':
                    addLog(`📦 [${data.node}] Assembly: 选中${data.selected} 淘汰${data.rejected} (${data.tokens} tokens)`);
                    break;
                case 'security_detect':
                    credCount++;
                    document.getElementById('footerCreds').textContent=credCount;
                    addLog(`🔑 凭证检测: [${data.file}] ${data.detail}`,'security');
                    break;
                case 'cost_update':
                    updateCost(data);
                    break;
                case 'degradation_triggered':
                    addLog(`⚡ 降级触发: ${data.reason}`,'security');
                    break;
                case 'file_processing':
                    addLog(`📄 处理: ${data.filename}${data.metadata.is_dangerous?' ⚠️ 高危':''}`);
                    break;
                case 'approval_request':
                    approvalCount++;
                    document.getElementById('footerApprovals').textContent=approvalCount;
                    showApprovalModal(data);
                    addLog(`🛑 审批请求: ${data.filename} — ${data.reason}`,'approval');
                    break;
                case 'file_audit_log':
                    addLog(data.message, data.type === 'rejection_intercepted' ? 'security' : 'routing');
                    break;
                case 'approval_result':
                    addLog(`${data.approved?'✅':'❌'} 审批${data.approved?'通过':'拒绝'}: ID=${data.approval_id}`,'approval');
                    break;
                case 'task_complete':
                    if (data.has_rejections) {
                        document.getElementById('statusBadge').textContent = '⚠️ 部分完成 (含安全拦截)';
                        document.getElementById('statusBadge').style.background = 'var(--warning-bg)';
                        document.getElementById('statusBadge').style.color = 'var(--warning)';
                        addLog(`🛡️ 任务执行完成 (含安全拦截保护): 成功重构 ${data.approved_count} 个文件，安全拒绝并保护 ${data.rejected_count} 个高危文件 (${data.rejected_filenames.join(', ')})`, 'approval');
                    } else {
                        document.getElementById('statusBadge').textContent = '🟢 全部完成';
                        document.getElementById('statusBadge').style.background = 'var(--surface-c)';
                        document.getElementById('statusBadge').style.color = 'var(--on-sv)';
                        addLog('🎉 所有文件重构成功完成！', 'routing');
                    }
                    if(data.routing_savings){
                        document.getElementById('savingsInfo').innerHTML=
                            `节省比例: <strong style="color:var(--success)">${(data.routing_savings.savings_ratio*100).toFixed(1)}%</strong>`;
                        document.getElementById('footerSavings').textContent=
                            `${(data.routing_savings.savings_ratio*100).toFixed(1)}%`;
                    }
                    break;
                case 'error':
                    addLog(`❌ 错误: ${data.message}`,'security');
                    break;
            }
        }

        function startTask(){
            const input=document.getElementById('taskInput');
            const task=input.value.trim();
            if(!task||!ws||ws.readyState!==1)return;
            document.getElementById('logContainer').innerHTML='';
            document.getElementById('statusBadge').innerHTML='<span class="spinner"></span>执行中...';
            ws.send(JSON.stringify({task}));
            input.value='';
        }

        function addLog(text,cls=''){
            const c=document.getElementById('logContainer');
            const e=c.querySelector('div[style*="text-align:center"]');
            if(e)e.remove();
            const d=document.createElement('div');
            d.className=`log-entry ${cls}`;
            d.textContent=text;
            c.appendChild(d);
            c.scrollTop=c.scrollHeight;
        }

        function setNodeActive(node){
            document.querySelectorAll('.node-card').forEach(n=>n.classList.remove('active'));
            const map={'planner_node':'node_planner','tool_executor':'node_executor','reflection_node':'node_reflection'};
            const el=document.getElementById(map[node]);
            if(el)el.classList.add('active');
        }

        function updateNodeModel(node,model,forced){
            const map={'planner_node':'planner','tool_executor':'executor','reflection_node':'reflection'};
            const key=map[node];
            if(!key)return;
            document.getElementById(key+'_model').textContent=model+(forced?' ⬇':'');
        }

        function updateCost(data){
            const ratio=data.usage_ratio||0;
            const arc=document.getElementById('costArc');
            arc.style.strokeDashoffset=314*(1-ratio);
            arc.style.stroke=ratio>0.9?'var(--error)':ratio>0.7?'var(--warning)':'var(--success)';
            document.getElementById('costLabel').textContent=`${(ratio*100).toFixed(0)}%`;
            document.getElementById('usedCost').textContent=`$${data.used_usd.toFixed(4)}`;
            document.getElementById('footerCost').textContent=`$${data.used_usd.toFixed(4)}`;
            document.getElementById('currentModel').textContent=data.current_model;

            const si=document.getElementById('stateIndicator');
            si.className=`state-indicator state-${data.state.toUpperCase()}`;
            si.textContent=data.state.toUpperCase();

            document.getElementById('stateBadge').textContent=data.state.toUpperCase();
        }

        function showApprovalModal(data){
            pendingApprovalId=data.approval_id;
            document.getElementById('approvalFile').textContent=`📄 文件: ${data.filename}`;
            document.getElementById('approvalReason').textContent=`原因: ${data.reason}`;
            document.getElementById('approvalImpact').textContent=`影响: ${data.impact}`;
            document.getElementById('approvalModal').classList.add('show');
        }

        function resolveApproval(approved){
            if(!pendingApprovalId)return;
            fetch(`/api/approval/${pendingApprovalId}?approved=${approved}`,{method:'POST'});
            document.getElementById('approvalModal').classList.remove('show');
            const al=document.getElementById('approvalLog');
            if(al.textContent==='暂无')al.innerHTML='';
            al.innerHTML+=`<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;">${approved?'✅':'❌'} ${pendingApprovalId}</div>`;
            pendingApprovalId=null;
        }

        async function resetAgent(){
            await fetch('/api/reset',{method:'POST'});
            location.reload();
        }

        connectWS();
    </script>
</body>
</html>
