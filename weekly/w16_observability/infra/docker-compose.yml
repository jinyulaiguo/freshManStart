# Week 16 · 本地可观测性集群
# Phoenix (Trace) + Prometheus (Metrics) + Grafana (Dashboard)
#
# 启动（在本目录执行）:
#   docker compose --env-file ../../../.env up -d
# 或:
#   ./start.sh
#
# 停止:
#   docker compose down
#
# 端口:
#   Phoenix UI / OTLP HTTP : 6006
#   Phoenix OTLP gRPC      : 4317
#   Prometheus UI          : 9090
#   Grafana UI             : 3000

name: freshman-w16-observability

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: w16-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # UI + OTLP HTTP (/v1/traces)
      - "4317:4317" # OTLP gRPC
    environment:
      # 本地学习默认关闭鉴权；若开启需在 .env 配置 PHOENIX_SECRET（≥32 字符）
      PHOENIX_ENABLE_AUTH: "${PHOENIX_ENABLE_AUTH:-false}"
      PHOENIX_SECRET: "${PHOENIX_SECRET:-default_phoenix_secret_key_32_chars_long_local_dev}"
    volumes:
      - phoenix_data:/root/.phoenix
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: w16-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    # 在 macOS/Windows Docker Desktop 下，host.docker.internal 内置可用；
    # 不要再用 extra_hosts 覆盖，否则可能映射到错误网关地址导致 connection refused。

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: w16-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  grafana:
    image: grafana/grafana:11.3.1
    container_name: w16-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-change_me_grafana_admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager

volumes:
  phoenix_data:
  prometheus_data:
  grafana_data:
